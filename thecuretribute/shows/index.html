    <script>
      const sheetUrl = "https://docs.google.com/spreadsheets/d/1ZNr46IqPU2YrYgbgHiprfR90_-goBhMSbv8pyBG4l5M/export?format=csv&gid=0";

      function parseCSV(csv) {
        const rows = [];
        let currentRow = [];
        let currentValue = "";
        let insideQuotes = false;

        for (let i = 0; i < csv.length; i++) {
          const char = csv[i];
          const nextChar = csv[i + 1];

          if (char === '"' && insideQuotes && nextChar === '"') {
            currentValue += '"';
            i++;
          } else if (char === '"') {
            insideQuotes = !insideQuotes;
          } else if (char === "," && !insideQuotes) {
            currentRow.push(currentValue);
            currentValue = "";
          } else if ((char === "\n" || char === "\r") && !insideQuotes) {
            if (currentValue || currentRow.length) {
              currentRow.push(currentValue);
              rows.push(currentRow);
              currentRow = [];
              currentValue = "";
            }
          } else {
            currentValue += char;
          }
        }

        if (currentValue || currentRow.length) {
          currentRow.push(currentValue);
          rows.push(currentRow);
        }

        return rows;
      }

      function parseSheetDate(dateString) {
        const parts = dateString.trim().split("/");
        const month = Number(parts[0]) - 1;
        const day = Number(parts[1]);
        let year = Number(parts[2]);
        // Normalize 2-digit years to 2000s (e.g. 23 -> 2023).
        // Without this, new Date(23, ...) is interpreted as 1923.
        if (year < 100) year += 2000;
        return new Date(year, month, day, 12, 0, 0);
      }

      function formatDate(dateString) {
        const date = parseSheetDate(dateString);
        const weekday = date.toLocaleDateString("en-US", { weekday: "short" }).toUpperCase();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const year = String(date.getFullYear()).slice(-2);
        return `${weekday}<br>${month}/${day}/${year}`;
      }

      function injectEventsJsonLd(shows, performer) {
        if (!shows || !shows.length) return;
        const events = shows.map(show => {
          const date = parseSheetDate(show.date);
          const isoDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
          const parts = (show.city || "").split(",").map(s => s.trim()).filter(Boolean);
          const locality = parts[0] || show.city || "";
          const region = parts[1] || "";
          const event = {
            "@context": "https://schema.org",
            "@type": "MusicEvent",
            "name": `${performer.name} at ${show.venue}`,
            "startDate": isoDate,
            "eventStatus": "https://schema.org/EventScheduled",
            "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
            "location": {
              "@type": "Place",
              "name": show.venue,
              "address": {
                "@type": "PostalAddress",
                "addressLocality": locality,
                "addressRegion": region,
                "addressCountry": "US"
              }
            },
            "performer": {
              "@type": "MusicGroup",
              "name": performer.name,
              "url": performer.url
            }
          };
          if (show.link) {
            event.offers = {
              "@type": "Offer",
              "url": show.link,
              "availability": "https://schema.org/InStock",
              "validFrom": new Date().toISOString().slice(0, 10)
            };
          }
          return event;
        });
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.textContent = JSON.stringify(events);
        document.head.appendChild(script);
      }

      function renderShows(shows, container) {
        container.innerHTML = "";
        if (!shows.length) {
          const empty = document.createElement("div");
          empty.className = "shows-empty";
          empty.textContent = container.dataset.emptyMessage || "No shows";
          container.appendChild(empty);
          return;
        }
        shows.forEach(show => {
          const row = document.createElement("div");
          row.className = "show-row";
          // Use column F "link label" from sheet; default to TICKETS if blank
          const labelRaw = show["link label"] || show["linklabel"] || show["link_label"] || "";
          const label = labelRaw.trim() || "TICKETS";
          row.innerHTML = `
            <div class="show-date">${formatDate(show.date)}</div>
            <div class="show-venue">${show.venue}</div>
            <div class="show-location">${show.city}</div>
            <div class="tickets-btn">
              ${show.link ? `<a href="${show.link}" target="_blank" rel="noopener noreferrer">${label}</a>` : ""}
            </div>
          `;
          container.appendChild(row);
        });
      }

      fetch(sheetUrl)
        .then(response => response.text())
        .then(csv => {
          const rows = parseCSV(csv);
          const headers = rows[0].map(header => header.trim().toLowerCase());

          const shows = rows.slice(1).map(row => {
            const show = {};
            headers.forEach((header, index) => {
              show[header] = row[index] ? row[index].trim() : "";
            });
            return show;
          });

          const cureShows = shows.filter(show => {
            return show.band && show.band.toLowerCase() === "cure" && show.date;
          });

          const today = new Date();
          today.setHours(0, 0, 0, 0);

          const upcoming = cureShows
            .filter(show => parseSheetDate(show.date) >= today)
            .sort((a, b) => parseSheetDate(a.date) - parseSheetDate(b.date));

          const past = cureShows
            .filter(show => parseSheetDate(show.date) < today)
            .sort((a, b) => parseSheetDate(b.date) - parseSheetDate(a.date));

          const upcomingGrid = document.getElementById("cure-upcoming-shows-grid");
          const pastGrid = document.getElementById("cure-past-shows-grid");

          if (upcomingGrid) renderShows(upcoming, upcomingGrid);
          if (pastGrid) renderShows(past, pastGrid);

          injectEventsJsonLd(upcoming, {
            name: "The Cure Tribute",
            url: "https://theenglishchannels.com/thecuretribute/"
          });
        })
        .catch(error => {
          console.error("Error loading shows:", error);
        });
    </script>

    const body = document.body;

    const overlay = document.getElementById('mobileMenu');

    function setOpen(isOpen) {
      body.classList.toggle('menu-open', isOpen);
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      menuBtn.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
    }

    menuBtn.addEventListener('click', () => setOpen(true));
    closeBtn.addEventListener('click', () => setOpen(false));

    // Close on link click
    overlay.addEventListener('click', (e) => {
      const link = e.target.closest('[data-close]');
      if (link) setOpen(false);
    });

    // Optional: click outside the menu-inner closes (clicking overlay background)
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) setOpen(false);
    });

    // Escape closes
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && body.classList.contains('menu-open')) setOpen(false);
    });

    // Auto-close if resizing up to desktop
    window.addEventListener('resize', () => {
      if (window.matchMedia('(min-width: 861px)').matches) setOpen(false);
    });

    // Dynamic footer year
    document.getElementById('footerYear').textContent = new Date().getFullYear();
