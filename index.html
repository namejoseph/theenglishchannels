    <script>
      // Fetch upcoming shows for both bands from the shared Google Sheet
      (function () {
        const sheetUrl = "https://docs.google.com/spreadsheets/d/1ZNr46IqPU2YrYgbgHiprfR90_-goBhMSbv8pyBG4l5M/export?format=csv&gid=0";

        function parseCSV(csv) {
          const rows = [];
          let currentRow = [];
          let currentValue = "";
          let insideQuotes = false;

          for (let i = 0; i < csv.length; i++) {
            const char = csv[i];
            const nextChar = csv[i + 1];

            if (char === '"' && insideQuotes && nextChar === '"') {
              currentValue += '"';
              i++;
            } else if (char === '"') {
              insideQuotes = !insideQuotes;
            } else if (char === "," && !insideQuotes) {
              currentRow.push(currentValue);
              currentValue = "";
            } else if ((char === "\n" || char === "\r") && !insideQuotes) {
              if (currentValue || currentRow.length) {
                currentRow.push(currentValue);
                rows.push(currentRow);
                currentRow = [];
                currentValue = "";
              }
            } else {
              currentValue += char;
            }
          }

          if (currentValue || currentRow.length) {
            currentRow.push(currentValue);
            rows.push(currentRow);
          }

          return rows;
        }

        function parseSheetDate(dateString) {
          const parts = dateString.trim().split("/");
          const month = Number(parts[0]) - 1;
          const day = Number(parts[1]);
          let year = Number(parts[2]);
          if (year < 100) year += 2000;
          return new Date(year, month, day, 12, 0, 0);
        }

        function formatHomeDate(dateString) {
          const date = parseSheetDate(dateString);
          const weekday = date.toLocaleDateString("en-US", { weekday: "short" }).toUpperCase();
          const month = date.toLocaleDateString("en-US", { month: "short" }).toUpperCase();
          const day = date.getDate();
          return `<span class="date-weekday">${weekday}</span> <span class="date-md">${month} ${day}</span>`;
        }

        function renderShows(shows, container) {
          container.innerHTML = "";
          if (!shows.length) {
            const empty = document.createElement("div");
            empty.className = "shows-empty";
            empty.textContent = container.dataset.emptyMessage || "No upcoming shows";
            container.appendChild(empty);
            return;
          }
          shows.forEach(show => {
            const item = document.createElement("div");
            item.className = "show-item";
            item.innerHTML = `
              <span class="date">${formatHomeDate(show.date)}</span>
              <span class="venue">${show.venue}</span>
              <span class="city">${show.city}</span>
            `;
            container.appendChild(item);
          });
        }

        fetch(sheetUrl)
          .then(response => response.text())
          .then(csv => {
            const rows = parseCSV(csv);
            const headers = rows[0].map(header => header.trim().toLowerCase());

            const shows = rows.slice(1).map(row => {
              const show = {};
              headers.forEach((header, index) => {
                show[header] = row[index] ? row[index].trim() : "";
              });
              return show;
            });

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            function upcomingFor(bandName) {
              return shows
                .filter(s => s.band && s.band.toLowerCase() === bandName && s.date)
                .filter(s => parseSheetDate(s.date) >= today)
                .sort((a, b) => parseSheetDate(a.date) - parseSheetDate(b.date));
            }

            const cureContainer = document.getElementById("cure-home-shows");
            const lcContainer = document.getElementById("lostcontrol-home-shows");

            if (cureContainer) renderShows(upcomingFor("cure"), cureContainer);
            if (lcContainer) renderShows(upcomingFor("lost control"), lcContainer);

            // Update footer year dynamically
            const footerYearEl = document.getElementById("footerYear");
            if (footerYearEl) footerYearEl.textContent = new Date().getFullYear();
          })
          .catch(error => {
            console.error("Error loading home shows:", error);
          });
      })();
    </script>
