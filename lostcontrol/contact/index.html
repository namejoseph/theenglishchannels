  <main>
    <section id="contact">
      <h1>CONTACT</h1>
      <form id="contactForm" class="contact-form" action="https://usebasin.com/f/f3fa340389da" method="POST"
        enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="message" placeholder="Message" required></textarea>
        <button class="btn" type="submit">Submit</button>
      </form>
      <div id="form-message"></div>
      <script>
        document.getElementById('contactForm').addEventListener('submit', function (e) {
          e.preventDefault();
          const form = e.target;
          const submitButton = form.querySelector('button[type="submit"]');
          const formMessage = document.getElementById('form-message');

          // Disable the submit button to prevent multiple submissions
          submitButton.disabled = true;
          submitButton.textContent = 'Sending...';
          formMessage.style.display = 'none';

          // Submit the form data using Fetch API
          fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: {
              'Accept': 'application/json'
            }
          })
            .then(response => {
              if (response.ok) {
                // Success message
                formMessage.textContent = 'Message sent successfully! We\'ll get back to you soon.';
                formMessage.style.color = '#fff';
                form.reset();
              } else {
                throw new Error('Network response was not ok');
              }
            })
            .catch(error => {
              // Error message
              formMessage.textContent = 'There was a problem sending your message. Please try again or email us directly.';
              formMessage.style.color = '#ff410d';
              console.error('Error:', error);
            })
            .finally(() => {
              formMessage.style.display = 'block';
              submitButton.disabled = false;
              submitButton.textContent = 'Submit';

              // Scroll to the message
              formMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        });
      </script>
    </section>
  </main>

  <script>
    const body = document.body;
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const overlay = document.getElementById('mobileMenu');

    function setOpen(isOpen) {
      body.classList.toggle('menu-open', isOpen);
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      menuBtn.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
    }

    menuBtn.addEventListener('click', () => setOpen(true));
    closeBtn.addEventListener('click', () => setOpen(false));

    // Close on link click
    overlay.addEventListener('click', (e) => {
      const link = e.target.closest('[data-close]');
      if (link) setOpen(false);
    });

    // Lightbox functionality
    function openLightbox(imageSrc) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      lightboxImg.src = imageSrc;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    // Close lightbox with Escape key
    document.addEventListener('keydown', function (event) {
      const lightbox = document.getElementById('lightbox');
      if (event.key === 'Escape' && lightbox && lightbox.classList.contains('active')) {
        closeLightbox();
      }
    });

    // Click outside menu-inner closes
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) setOpen(false);
    });

    // Escape closes menu
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && body.classList.contains('menu-open')) setOpen(false);
    });

    // Auto-close if resizing up to desktop
    window.addEventListener('resize', () => {
      if (window.matchMedia('(min-width: 961px)').matches) setOpen(false);
    });

  </script>
