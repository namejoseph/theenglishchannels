  <!-- Fetch upcoming Lost Control shows from the shared Google Sheet -->
  <script>
    (function () {
      const sheetUrl = "https://docs.google.com/spreadsheets/d/1ZNr46IqPU2YrYgbgHiprfR90_-goBhMSbv8pyBG4l5M/export?format=csv&gid=0";

      function parseCSV(csv) {
        const rows = [];
        let currentRow = [];
        let currentValue = "";
        let insideQuotes = false;

        for (let i = 0; i < csv.length; i++) {
          const char = csv[i];
          const nextChar = csv[i + 1];

          if (char === '"' && insideQuotes && nextChar === '"') {
            currentValue += '"';
            i++;
          } else if (char === '"') {
            insideQuotes = !insideQuotes;
          } else if (char === "," && !insideQuotes) {
            currentRow.push(currentValue);
            currentValue = "";
          } else if ((char === "\n" || char === "\r") && !insideQuotes) {
            if (currentValue || currentRow.length) {
              currentRow.push(currentValue);
              rows.push(currentRow);
              currentRow = [];
              currentValue = "";
            }
          } else {
            currentValue += char;
          }
        }

        if (currentValue || currentRow.length) {
          currentRow.push(currentValue);
          rows.push(currentRow);
        }

        return rows;
      }

      function parseSheetDate(dateString) {
        const parts = dateString.trim().split("/");
        const month = Number(parts[0]) - 1;
        const day = Number(parts[1]);
        let year = Number(parts[2]);
        if (year < 100) year += 2000;
        return new Date(year, month, day, 12, 0, 0);
      }

      function formatDate(dateString) {
        const date = parseSheetDate(dateString);
        const weekday = date.toLocaleDateString("en-US", { weekday: "short" }).toUpperCase();
        const month = date.toLocaleDateString("en-US", { month: "short" }).toUpperCase();
        const day = date.getDate();
        return `${weekday} ${month} ${day}`;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderShows(shows, tbody) {
        tbody.innerHTML = "";
        shows.forEach(show => {
          const labelRaw = show["link label"] || show["linklabel"] || show["link_label"] || "";
          const label = (labelRaw.trim() || "TICKETS");
          const linkCell = show.link
            ? `<a href="${escapeHtml(show.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`
            : "";
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${formatDate(show.date)}</td>
            <td>${escapeHtml(show.venue)}</td>
            <td>${escapeHtml(show.city)}</td>
            <td>${linkCell}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      fetch(sheetUrl)
        .then(response => response.text())
        .then(csv => {
          const rows = parseCSV(csv);
          const headers = rows[0].map(header => header.trim().toLowerCase());

          const shows = rows.slice(1).map(row => {
            const show = {};
            headers.forEach((header, index) => {
              show[header] = row[index] ? row[index].trim() : "";
            });
            return show;
          });

          const today = new Date();
          today.setHours(0, 0, 0, 0);

          const upcoming = shows
            .filter(s => s.band && s.band.toLowerCase() === "lost control" && s.date)
            .filter(s => parseSheetDate(s.date) >= today)
            .sort((a, b) => parseSheetDate(a.date) - parseSheetDate(b.date));

          const tbody = document.getElementById("lostcontrol-upcoming-shows-body");
          if (tbody) renderShows(upcoming, tbody);
        })
        .catch(error => {
          console.error("Error loading Lost Control shows:", error);
        });
    })();
  </script>

  <script>
    const body = document.body;
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const overlay = document.getElementById('mobileMenu');

    function setOpen(isOpen) {
      body.classList.toggle('menu-open', isOpen);
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      menuBtn.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
    }

    menuBtn.addEventListener('click', () => setOpen(true));
    closeBtn.addEventListener('click', () => setOpen(false));

    // Close on link click
    overlay.addEventListener('click', (e) => {
      const link = e.target.closest('[data-close]');
      if (link) setOpen(false);
    });

    // Lightbox functionality
    function openLightbox(imageSrc) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      lightboxImg.src = imageSrc;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    // Close lightbox with Escape key
    document.addEventListener('keydown', function(event) {
      const lightbox = document.getElementById('lightbox');
      if (event.key === 'Escape' && lightbox && lightbox.classList.contains('active')) {
        closeLightbox();
      }
    });

    // Click outside menu-inner closes
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) setOpen(false);
    });

    // Escape closes menu
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && body.classList.contains('menu-open')) setOpen(false);
    });

    // Auto-close if resizing up to desktop
    window.addEventListener('resize', () => {
      if (window.matchMedia('(min-width: 961px)').matches) setOpen(false);
    });

  </script>
